spring.application.name=job-tracker-backend

# Database Configuration (PostgreSQL — provided by hosting platform via env vars)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (tuned for free-tier hosting limits)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# H2 Console — must stay OFF in production (security risk)
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT — secret MUST be set via env var in production, never rely on the default
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Server Port (hosting platform provides PORT env variable)
server.port=${PORT:8081}

# CORS — set to the real deployed frontend URL via env var
cors.allowed-origins=${CORS_ORIGINS}

# Logging
logging.level.com.jobtracker=INFO
logging.level.org.springframework.security=WARN
