spring.application.name=job-tracker-backend

# Database Configuration (file-based H2 — persists to disk, survives restarts/clock glitches)
spring.datasource.url=jdbc:h2:file:./data/jobtracker;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional — access at http://localhost:8081/h2-console)
spring.h2.console.enabled=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:MyVerySecretJobTrackerKey2024SuperLongKeyThatIsAtLeast32Chars}
jwt.expiration=86400000

# Server Port (Render provides PORT env variable)
server.port=${PORT:8081}

# CORS — comma separated origins
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Logging
logging.level.com.jobtracker=INFO
logging.level.org.springframework.security=WARN
