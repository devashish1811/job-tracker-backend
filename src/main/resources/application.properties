spring.application.name=job-tracker-backend

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (optimized for free tier)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:MyVerySecretJobTrackerKey2024SuperLongKeyThatIsAtLeast32Chars}
jwt.expiration=86400000

# Server Port (Render provides PORT env variable)
server.port=${PORT:8080}

# CORS — comma separated origins
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Logging
logging.level.com.jobtracker=INFO
logging.level.org.springframework.security=WARN
